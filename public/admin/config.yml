backend:
  name: git-gateway
  branch: main
  base_url: https://townfield-allotments.netlify.app/admin

media_folder: "public/images/galleries"
public_folder: "/images/galleries"

collections:
  # Gallery Collection - Simplified for Bulk Uploads
  - name: "galleries"
    label: "Galleries"
    description: "Manage your photo galleries (upload images via media library first)"
    folder: "src/content/galleries"
    create: true
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    fields:
      - {
          label: "Gallery Title",
          name: "title",
          widget: "string",
          required: true,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: true,
        }
      - {
          label: "Gallery ID",
          name: "galleryId",
          widget: "string",
          required: true,
          hint: "Folder name where images are stored (e.g., autumn-harvest). Bulk upload images to /images/galleries/[id]/ in media library first.",
        }
      - {
          label: "Gallery Slug (URL)",
          name: "slug",
          widget: "string",
          required: true,
          hint: "Used in URL - lowercase, no spaces",
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Cover Image",
          name: "coverImage",
          widget: "image",
          required: true,
          hint: "Path to cover image (e.g., /images/galleries/autumn-harvest/photo1.jpg)",
        }
