backend:
  name: git-gateway
  branch: main
  base_url: https://townfield-allotments.netlify.app/admin

media_folder: "public/images/galleries"
public_folder: "/images/galleries"

collections:
  # Gallery Collections - Organize galleries into categories
  - name: "galleryCollections"
    label: "Gallery Collections"
    description: "Organize your galleries into collections (e.g., 'Summer Events', 'Harvests', 'Members')"
    folder: "src/content/collections"
    create: true
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    fields:
      - {
          label: "Collection Name",
          name: "title",
          widget: "string",
          required: true,
          hint: "e.g., Summer Events, Member Spotlights, Monthly Highlights",
        }
      - {
          label: "Collection Slug",
          name: "slug",
          widget: "string",
          required: true,
          hint: "Used in URL - lowercase, no spaces (e.g., summer-events)",
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
          hint: "What this collection is about",
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
          hint: "Show this collection prominently",
        }

  # Gallery Collection - Individual galleries
  - name: "galleries"
    label: "Galleries"
    description: "Individual photo galleries. Upload images to /src/images/galleries/[gallery-id]/ via Git, then create entry here."
    folder: "src/content/galleries"
    create: true
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    fields:
      - {
          label: "Gallery Title",
          name: "title",
          widget: "string",
          required: true,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: true,
        }
      - {
          label: "Gallery ID",
          name: "galleryId",
          widget: "string",
          required: true,
          hint: "Folder name in /images/galleries/ where photos are stored",
        }
      - {
          label: "Gallery Slug (URL)",
          name: "slug",
          widget: "string",
          required: true,
          hint: "Used in URL",
        }
      - {
          label: "Gallery Collection",
          name: "collectionId",
          widget: "relation",
          collection: "galleryCollections",
          search_fields: ["title"],
          value_field: "slug",
          display_fields: ["title"],
          hint: "Which collection does this gallery belong to?",
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Cover Image Path",
          name: "coverImage",
          widget: "string",
          required: true,
          hint: "e.g., /images/galleries/autumn-harvest/photo1.jpg",
        }
