backend:
  name: git-gateway
  branch: main
  base_url: https://townfield-allotments.netlify.app/admin

media_folder: "public/images/galleries"
public_folder: "/images/galleries"

collections:
  # Gallery Collection - NEW APPROACH
  - name: "galleries"
    label: "Galleries"
    description: "Manage your photo galleries"
    folder: "src/content/galleries"
    create: true
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    fields:
      - {
          label: "Gallery Title",
          name: "title",
          widget: "string",
          required: true,
        }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: true,
        }
      - {
          label: "Gallery Slug (URL)",
          name: "slug",
          widget: "string",
          required: true,
          hint: "Used in URL - lowercase, no spaces, e.g. autumn-harvest",
        }
      - {
          label: "Featured",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - {
          label: "Cover Image",
          name: "coverImage",
          widget: "image",
          required: true,
          hint: "Main image for gallery card",
        }
      - label: "Gallery Images"
        name: "images"
        widget: "list"
        fields:
          - { label: "Photo", name: "url", widget: "image", required: true }
          - {
              label: "Photo Caption",
              name: "caption",
              widget: "string",
              required: false,
            }
